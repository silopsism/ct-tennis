<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPT Tennis League 2026</title>
  <meta name="description" content="Live standings and fixture results for the 2026 CPT Tennis League.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>CPT Tennis League <span class="season">2026</span></h1>
      <p class="status" id="status" aria-live="polite">Loading results…</p>
    </div>
  </header>

  <main class="wrap">
    <nav class="divisions" id="divisions" aria-label="Choose a league"></nav>

    <section class="panel" id="panel" hidden>
      <div class="panel-head">
        <h2 id="division-title"></h2>
        <div class="tools">
          <div class="toggle" role="tablist" aria-label="View">
            <button type="button" role="tab" data-view="standings">Standings</button>
            <button type="button" role="tab" data-view="weekly">By week</button>
            <button type="button" role="tab" data-view="fixtures">Fixtures</button>
          </div>
          <button type="button" class="wand" id="wand" aria-pressed="false" hidden
            aria-label="Project the rest of the season" title="Project the rest of the season">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 20 14.5 9.5"/>
              <path d="m14.5 9.5 2.5-2.5" stroke-width="3.2"/>
              <path d="M18 2.5v3M16.5 4h3"/>
              <path d="M20.5 10v2M19.5 11h2"/>
              <path d="M10 3v2M9 4h2"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="content"></div>
    </section>
  </main>

  <dialog id="editor" class="editor" aria-labelledby="ed-title">
    <form method="dialog" id="ed-form">
      <h3 id="ed-title">Enter a score</h3>
      <p class="ed-sub" id="ed-sub"></p>

      <div class="ed-teams">
        <span id="ed-left"></span>
        <span class="ed-v">v</span>
        <span id="ed-right"></span>
      </div>

      <fieldset>
        <legend>Matches won <span class="ed-order" id="ed-m-order"></span></legend>
        <div class="ed-matches" id="ed-matches"></div>
      </fieldset>

      <fieldset>
        <legend>Sets won</legend>
        <div class="ed-sets">
          <label><input id="ed-ls" type="number" inputmode="numeric" min="0"><span id="ed-ls-name"></span></label>
          <span class="ed-dash">–</span>
          <label><input id="ed-rs" type="number" inputmode="numeric" min="0"><span id="ed-rs-name"></span></label>
        </div>
        <p class="ed-warn" id="ed-warn" hidden></p>
      </fieldset>

      <p class="ed-preview" id="ed-preview"></p>
      <p class="ed-note">Saved on this device only. The official result replaces it once it's in the results sheet.</p>

      <div class="ed-actions">
        <button type="button" class="ed-remove" id="ed-remove">Remove my score</button>
        <span class="ed-spacer"></span>
        <button type="button" class="ed-btn" id="ed-cancel">Cancel</button>
        <button type="submit" class="ed-btn primary" id="ed-save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
