<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cape Town Tennis League 2026</title>
  <meta name="description" content="Live standings and fixture results for the 2026 Cape Town Tennis League.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <!-- Top-down hard court, drawn to scale in centimetres (23.77 m × 10.97 m) with run-off around it. -->
    <svg class="court" viewBox="-400 -468 3177 1617" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect x="-400" y="-468" width="3177" height="1617" class="runoff"/>
      <rect x="0" y="0" width="2377" height="1097" class="surface"/>
    </svg>
    <!-- Lines on their own layer so they can fade out behind the title. -->
    <svg class="court court-lines" viewBox="-400 -468 3177 1617" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="lines">
        <rect x="0" y="0" width="2377" height="1097"/>
        <path d="M0 137H2377M0 960H2377"/>
        <path d="M548.5 137V960M1828.5 137V960M548.5 548.5H1828.5"/>
        <path d="M0 548.5H20M2357 548.5H2377"/>
      </g>
      <path class="net" d="M1188.5 -91V1188"/>
      <circle class="post" cx="1188.5" cy="-91" r="9"/>
      <circle class="post" cx="1188.5" cy="1188" r="9"/>
    </svg>
    <div class="wrap hero-inner">
      <p class="eyebrow">2026 season</p>
      <h1>
        <svg class="ball" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15"/>
          <path d="M4.5 6.5c6 4 6 15 0 19M27.5 6.5c-6 4-6 15 0 19"/>
        </svg>
        Cape Town Tennis League
      </h1>
      <p class="status" id="status" aria-live="polite">Loading results…</p>
    </div>
  </header>

  <main class="wrap">
    <nav class="divisions" id="divisions" aria-label="Choose a league"></nav>

    <section class="panel" id="panel" hidden>
      <div class="panel-head">
        <h2 id="division-title"></h2>
        <div class="tools">
          <div class="toggle" role="tablist" aria-label="View">
            <button type="button" role="tab" data-view="standings">Standings</button>
            <button type="button" role="tab" data-view="weekly">By week</button>
            <button type="button" role="tab" data-view="fixtures">Fixtures</button>
          </div>
          <button type="button" class="wand" id="wand" aria-pressed="false" hidden
            aria-label="Project the rest of the season" title="Project the rest of the season">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 20 14.5 9.5"/>
              <path d="m14.5 9.5 2.5-2.5" stroke-width="3.2"/>
              <path d="M18 2.5v3M16.5 4h3"/>
              <path d="M20.5 10v2M19.5 11h2"/>
              <path d="M10 3v2M9 4h2"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="content"></div>
    </section>
  </main>

  <dialog id="editor" class="editor" aria-labelledby="ed-title">
    <form method="dialog" id="ed-form">
      <h3 id="ed-title">Enter a score</h3>
      <p class="ed-sub" id="ed-sub"></p>

      <div class="ed-teams">
        <span id="ed-left"></span>
        <span class="ed-v">v</span>
        <span id="ed-right"></span>
      </div>

      <fieldset>
        <legend>1. Matches won <span class="ed-order" id="ed-m-order"></span></legend>
        <div class="ed-matches" id="ed-matches"></div>
        <p class="ed-hint" id="ed-hint"></p>
      </fieldset>

      <fieldset id="ed-score" hidden>
        <legend>2. Sets and points</legend>
        <table class="ed-table">
          <thead><tr><th></th><th>Sets</th><th>Bonus</th><th>Points</th></tr></thead>
          <tbody id="ed-rows"></tbody>
        </table>
        <p class="ed-hint">Starts at straight sets. Add a set for each match a team lost in three sets.</p>
      </fieldset>

      <p class="ed-preview" id="ed-preview"></p>
      <p class="ed-note">Saved on this device only. The official result replaces it once it's in the results sheet.</p>

      <div class="ed-actions">
        <button type="button" class="ed-remove" id="ed-remove">Remove my score</button>
        <span class="ed-spacer"></span>
        <button type="button" class="ed-btn" id="ed-cancel">Cancel</button>
        <button type="submit" class="ed-btn primary" id="ed-save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
